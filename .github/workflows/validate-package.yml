name: Validate and package Caption IA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate release
        run: node scripts/validate-release.js

      - name: Verify client narrative UX and privacy
        run: node scripts/test-montagem-cliente.js

      - name: Read version
        if: github.event_name != 'pull_request'
        id: version
        shell: bash
        run: |
          VERSION="$(node scripts/read-version.js)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build ZIP
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHANGELOG="ALTERACOES_${VERSION}.txt"
          FILES=(CaptionIA INSTALAR_CAPTION_IA.bat INSTALAR_CAPTION_IA.ps1 LEIA_PRIMEIRO.txt)
          zip -r -9 "CaptionIA-${VERSION}.zip" "${FILES[@]}"

      - name: Upload ZIP
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: CaptionIA-${{ steps.version.outputs.version }}
          path: CaptionIA-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Build Cloud Beta ZIP for manual Windows validation
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          VERSION="$(node scripts/read-version.js)"
          zip -q -r -9 "CaptionIA-${VERSION}-CLOUD-BETA.zip" CaptionIA TESTAR_CLOUD_BETA.bat RESTAURAR_CLOUD_BETA.bat

      - name: Upload Cloud Beta ZIP
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: CaptionIA-Cloud-Beta-Windows
          path: CaptionIA-*-CLOUD-BETA.zip
          if-no-files-found: error
          retention-days: 14

      - name: Build AutoSFX Hotfix ZIP
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          zip -q -9 CaptionIA-AutoSFX-Hotfix.zip \
            CaptionIA/index.html \
            CaptionIA/js/autosfx.js \
            CaptionIA/js/sfx_scheduler.js \
            CaptionIA/js/sfx_dual_tracks.js \
            CaptionIA/js/sfx_track_diagnostics.js \
            CaptionIA/js/sfx_timing_calibration.js \
            APLICAR_PATCH_SFX.bat RESTAURAR_PATCH_SFX.bat

      - name: Upload AutoSFX Hotfix ZIP
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: CaptionIA-AutoSFX-Hotfix-Windows
          path: CaptionIA-AutoSFX-Hotfix.zip
          if-no-files-found: error
          retention-days: 14

  windows-install-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate installer in temporary Windows profile
        shell: powershell
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'CaptionIATest\Roaming'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'CaptionIATest\Local'
          New-Item -ItemType Directory -Path $env:APPDATA, $env:LOCALAPPDATA -Force | Out-Null
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\INSTALAR_CAPTION_IA.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Primeira instalacao falhou' }
          $folder = Join-Path $env:APPDATA 'Adobe\CEP\extensions\CaptionIA'
          if (!(Test-Path (Join-Path $folder 'jsx\hostscript.jsxbin'))) { throw 'Executor Adobe ausente' }
          if (Test-Path (Join-Path $folder 'icons')) { throw 'Icones VictorFrame ainda instalados' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\INSTALAR_CAPTION_IA.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Reinstalacao com backup falhou' }
          $backups = @(Get-ChildItem -Path (Join-Path $env:LOCALAPPDATA 'CaptionIA\Backups') -Directory)
          if ($backups.Count -lt 1) { throw 'Backup anterior nao gerado' }
          Write-Host 'Smoke Windows PASS: instalar, reinstalar, backup, sem icon antigo.'
