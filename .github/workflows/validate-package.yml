name: Validate and package Caption IA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate release
        run: node scripts/validate-release.js

      - name: Read version
        if: github.event_name != 'pull_request'
        id: version
        shell: bash
        run: |
          VERSION="$(node scripts/read-version.js)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build ZIP
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHANGELOG="ALTERACOES_${VERSION}.txt"
          FILES=(CaptionIA INSTALAR_CAPTION_IA.bat INSTALAR_CAPTION_IA_MAC.command DESINSTALAR_CAPTION_IA.bat README.md)
          if [ -f "$CHANGELOG" ]; then FILES+=("$CHANGELOG"); fi
          zip -r -9 "CaptionIA-${VERSION}.zip" "${FILES[@]}"

      - name: Upload ZIP
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: CaptionIA-${{ steps.version.outputs.version }}
          path: CaptionIA-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30
