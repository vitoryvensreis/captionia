name: Build Caption IA Desktop (Windows and macOS)

on:
  push:
    branches: [feature/desktop-app, main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python engine and FFmpeg smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal engine dependencies
        run: python -m pip install requests imageio-ffmpeg
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: FFmpeg end-to-end render (fake transcription, no external API)
        run: PYTHONPATH=. python tests/smoke_render.py

  windows:
    name: Windows x64 installer
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install Inno Setup when missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build executable and setup
        shell: pwsh
        working-directory: desktop
        run: ./packaging/build-win.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CaptionIA-Desktop-Windows-Setup
          path: desktop/dist_installer/*.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS DMG (${{ matrix.arch }})
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: intel
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build app and DMG
        working-directory: desktop
        run: bash packaging/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CaptionIA-Desktop-macOS-${{ matrix.arch }}
          path: desktop/dist_installer/*.dmg
          if-no-files-found: error
          retention-days: 30